<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Shopping List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Shopping List</h1>

        <div class="input-section">
            <input type="text" id="item-input" placeholder="Enter item name...">
            <input type="number" id="price-input" placeholder="Price (ksh)..." min="0" step="5">
            <button id="add-btn">Add</button>
        </div>

        <div class="controls">
            <button id="clear-btn">Clear List</button>
        </div>

        <ul id="shopping-list"></ul>

        <div class="summary">
            <h3>Total Cost: ksh<span id="total-cost">0.00</span></h3>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
